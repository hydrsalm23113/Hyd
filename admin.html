<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body><div id="root"></div><script src="/app.js"></script><script>
let drafted=false;
const get=p=>p.split('.').reduce((o,k)=>o?.[k],D);
const set=(p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],D)[l]=v};
const f=(l,p,t='text')=>`<label>${l}<input type="${t}" data-p="${p}" value="${esc(get(p))}"></label>`;
const keep=()=>{try{localStorage.setItem('draft',JSON.stringify(D))}catch{}};
function shrink(file){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(file)})}
function draw(){
 const y=scrollY;
 $('#root').innerHTML=`<div class="w pn"><a class="brand" href="/">← عودة للموقع</a><h2>لوحة التحكم</h2>
 <p style="color:var(--mut)">عدّل ما تريد ثم اضغط «تنزيل data.json» واستبدل به الملف في مشروعك وأعد النشر. تُحفظ تعديلاتك تلقائيًا في هذا المتصفح حتى تنشرها.${drafted?' <a href="#" data-a="reset" style="color:var(--gold)">تجاهل المسودة</a>':''}</p>
 <h3>الموقع</h3>${f('اسم العلامة','brand')}${f('العنوان الرئيسي','headline')}<label>الوصف<textarea rows="3" data-p="desc">${esc(D.desc)}</textarea></label>
 ${f('رابط الطلب (واتساب أو إنستغرام)','orderUrl')}${f('رابط حسابك','igUrl')}<div class="two">${f('العملة','currency')}${f('سعر الدعوة','price','number')}</div>${f('نص التذييل','footer')}
 <label>الأقسام (افصل بينها بفاصلة)<input data-cats value="${esc(D.cats.join('، '))}"></label>
 <h3>الإضافات</h3>${D.addons.map((a,i)=>`<div class="bx">${f('الاسم',`addons.${i}.name`)}${f('السعر',`addons.${i}.price`,'number')}${f('الوصف',`addons.${i}.desc`)}<button class="d" data-a="deladd" data-i="${i}">حذف الإضافة</button></div>`).join('')}<button class="btn" data-a="addadd">+ إضافة</button>
 <h3>القوالب (${D.items.length})</h3>${D.items.map((t,i)=>`<div class="bx">${f('اسم القالب',`items.${i}.title`)}${f('المعرّف في الرابط (إنجليزي بلا مسافات)',`items.${i}.id`)}
 <label>القسم<select data-p="items.${i}.cat">${D.cats.map(c=>`<option ${c===t.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>${f('الوصف',`items.${i}.desc`)}
 <label>المزايا (كل ميزة في سطر)<textarea rows="3" data-feat="${i}">${esc((t.features||[]).join('\n'))}</textarea></label>${f('سعر خاص (اتركه فارغًا للسعر العام)',`items.${i}.price`,'number')}
 <div class="two"><label>لون ١<input type="color" data-p="items.${i}.c1" value="${esc(t.c1)}"></label><label>لون ٢<input type="color" data-p="items.${i}.c2" value="${esc(t.c2)}"></label></div>
 <label>صورة القالب${t.img?' ✓':''}<input type="file" accept="image/*" data-up="${i}"></label>${t.img?`<button class="d" data-a="delimg" data-i="${i}">إزالة الصورة</button> `:''}<button class="d" data-a="delitem" data-i="${i}">حذف القالب</button></div>`).join('')}
 <button class="btn" data-a="additem">+ قالب جديد</button><div class="sv"><button class="btn p" data-a="dl">تنزيل data.json</button></div></div>`;
 scrollTo(0,y);
}
$d.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;e.preventDefault();
 const a=el.dataset.a,i=+el.dataset.i;
 if(a==='dl'){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),l=$d.createElement('a');l.href=URL.createObjectURL(b);l.download='data.json';l.click();return}
 if(a==='reset'){try{localStorage.removeItem('draft')}catch{}return load().then(()=>{drafted=false;draw()})}
 if(a==='addadd')D.addons.push({id:'a'+Date.now().toString(36),name:'إضافة جديدة',price:1000,desc:''});
 else if(a==='deladd')D.addons.splice(i,1);
 else if(a==='additem')D.items.unshift({id:'t'+Date.now().toString(36),title:'قالب جديد',cat:D.cats[0]||'',desc:'',features:[],img:'',price:'',c1:'#c9a24b',c2:'#f6ead0'});
 else if(a==='delitem'){if(!confirm('حذف هذا القالب؟'))return;D.items.splice(i,1)}
 else if(a==='delimg')D.items[i].img='';
 keep();draw();
});
$d.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.p)set(t.dataset.p,t.type==='number'&&t.value!==''?+t.value:t.value);
 else if(t.dataset.feat!==undefined)D.items[+t.dataset.feat].features=t.value.split('\n').map(s=>s.trim()).filter(Boolean);
 else if(t.hasAttribute('data-cats'))D.cats=t.value.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
 keep()});
$d.addEventListener('change',async e=>{const t=e.target;if(t.dataset.up===undefined||!t.files[0])return;D.items[+t.dataset.up].img=await shrink(t.files[0]);keep();draw()});
load().then(()=>{try{const d=localStorage.getItem('draft');if(d){D=JSON.parse(d);drafted=true}}catch{}draw()}).catch(()=>{$('#root').textContent='تعذّر تحميل data.json'});
</script></body></html>
