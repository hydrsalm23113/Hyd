<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدعوة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#7d1f3a;--c2:#f4c9d1}
*{box-sizing:border-box}
body{margin:0;font-family:'Amiri',Georgia,serif;color:#3b2a2a;background:#fbf3e6;font-size:1.1rem}
body.lock{overflow:hidden}
.back{position:fixed;top:10px;inset-inline-end:12px;z-index:30;color:var(--c1);background:#fffc;padding:3px 12px;border-radius:99px;text-decoration:none;font-size:.9rem}
#stage{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(circle at 50% 35%,#fff,var(--c2));transition:opacity .9s}
#stage.out{opacity:0;pointer-events:none}
.env{position:relative;width:min(84vw,340px);aspect-ratio:3/2;cursor:pointer}
.bd{position:absolute;inset:0;border-radius:6px;background:var(--c2);box-shadow:0 18px 40px #0003;background-image:radial-gradient(circle,#fff7 0 5px,transparent 6px),radial-gradient(circle,#fff5 0 9px,transparent 10px);background-size:34px 34px,70px 70px;background-position:0 0,17px 17px;filter:brightness(.96)}
.cd2{position:absolute;left:7%;right:7%;top:6%;bottom:6%;background:#fffaf0;border:1px solid #e6d6bb;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;transition:transform 1s .5s;text-align:center;color:var(--c1)}
.cd2 b{font-size:1.5rem}
.pk{position:absolute;inset:0;background:var(--c2);filter:brightness(.93);clip-path:polygon(0 0,50% 60%,100% 0,100% 100%,0 100%);z-index:3;border-radius:6px}
.fl{position:absolute;inset:0 0 auto 0;height:62%;background:var(--c2);filter:brightness(.9);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;transition:transform .7s,z-index 0s .35s}
.seal{position:absolute;left:50%;top:62%;width:58px;height:58px;margin:-29px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff6,transparent 45%),var(--c1);color:#fff;font-size:26px;z-index:5;cursor:pointer;box-shadow:0 4px 10px #0005;animation:pl 1.6s infinite}
.seal.gone{opacity:0;transform:scale(.5);transition:.25s;animation:none}
@keyframes pl{50%{transform:scale(1.08)}}
.sh{position:absolute;left:50%;top:62%;width:12px;height:12px;margin:-6px;background:var(--c1);border-radius:3px;z-index:6;transition:transform .9s cubic-bezier(.2,.8,.3,1),opacity .9s}
.env.open .fl{transform:rotateX(180deg);z-index:1}
.env.open .cd2{transform:translateY(-58%)}
.hint{margin:0;color:var(--c1);transition:opacity .4s}
.env.open~.hint{opacity:0}
#pt{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
#pt i{position:absolute;top:-30px;border-radius:0 100% 0 100%;opacity:.85;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),112vh,0) rotate(540deg)}}
#inv{max-width:540px;margin:0 auto;padding:56px 16px 50px;text-align:center}
.paper{background:#fffaf0;padding:34px 20px;box-shadow:0 10px 30px #0002,inset 0 0 0 6px #fffaf0,inset 0 0 0 7px var(--c1)}
.sm{color:var(--c1);letter-spacing:.2em;margin:0}
.nm{font-size:clamp(2.3rem,11vw,3.4rem);color:var(--c1);margin:.3em 0;line-height:1.2}
.dt{font-size:1.25rem;font-weight:700}
#cdn{display:flex;justify-content:center;gap:10px;margin:16px 0}
#cdn div{min-width:64px;border:1px solid var(--c1);padding:6px 4px}
#cdn b{display:block;font-size:1.5rem;color:var(--c1)}
#cdn small{font-size:.8rem}
.bt{display:inline-block;margin:8px 0;background:var(--c1);color:#fff;text-decoration:none;padding:9px 24px;border-radius:99px}
h3{color:var(--c1);margin:30px 0 14px}
.tl{position:relative;padding-inline-start:36px;text-align:start;margin:0 14px 22px}
.tl:before{content:"";position:absolute;inset-inline-start:9px;top:8px;bottom:14px;width:2px;background:#0002}
.tl i{position:absolute;inset-inline-start:9px;top:8px;width:2px;height:0;background:var(--c1)}
.st{position:relative;padding-bottom:22px}
.st:before{content:"";position:absolute;inset-inline-start:-33px;top:7px;width:12px;height:12px;border-radius:50%;background:#fffaf0;border:2px solid #0004;transition:.3s}
.st.on:before{background:var(--c1);border-color:var(--c1)}
.st b{color:var(--c1);margin-inline-end:6px}
</style></head>
<body class="lock">
<a class="back" id="bk" href="/">← صفحة القالب</a>
<div id="inv"></div>
<div id="stage"><div class="env" id="env"><div class="bd"></div><div class="cd2"><small>دعوة خاصة</small><b id="sn"></b></div><div class="pk"></div><div class="fl"></div><button class="seal" id="seal" aria-label="افتح الدعوة">❀</button></div><p class="hint">المس الختم لفتح الدعوة</p></div>
<div id="pt"></div>
<script src="/app.js"></script><script>
const DEF={names:'أحمد ♥ سارة',date:'2026-12-18T19:00',venue:'قاعة الياسمين — بغداد',note:'بكل الحب والفرح يتشرّف أهل العروسين بدعوتكم لحضور حفل زفافهما',program:'19:00 | استقبال الضيوف\n20:00 | دخول العروسين\n21:00 | العشاء\n22:30 | الكيك والتصوير'};
const id=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
let opened=false,d,ok;
const prog=()=>{const t=$('.tl');if(!t)return;const r=t.getBoundingClientRect(),H=r.height-22,p=Math.min(1,Math.max(0,(innerHeight*.75-r.top)/r.height)),L=p*H;$('.tl i').style.height=L+'px';document.querySelectorAll('.st').forEach(s=>s.classList.toggle('on',s.offsetTop+8<=L))};
function tick(){const el=$('#cdn');if(!el||!ok)return;const ms=d-Date.now();if(ms<=0){el.innerHTML='<b>حان الموعد ✦</b>';return}const S=Math.floor(ms/1000);el.innerHTML=[[Math.floor(S/86400),'يوم'],[Math.floor(S%86400/3600),'ساعة'],[Math.floor(S%3600/60),'دقيقة'],[S%60,'ثانية']].map(a=>`<div><b>${a[0]}</b><small>${a[1]}</small></div>`).join('')}
function petals(){const p=$('#pt');for(let i=0;i<34;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;--x:${(Math.random()-.5)*160}px;width:${8+Math.random()*10}px;height:${10+Math.random()*12}px;background:${Math.random()<.6?'var(--c1)':'var(--c2)'};animation-duration:${4+Math.random()*4}s;animation-delay:${Math.random()*1.8}s`;p.append(e)}setTimeout(()=>p.innerHTML='',9500)}
function crumble(){const e=$('#env');for(let i=0;i<9;i++){const s=document.createElement('b');s.className='sh';e.append(s);const a=Math.random()*6.28,r=50+Math.random()*70;requestAnimationFrame(()=>{s.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r+40}px) rotate(${Math.random()*360}deg)`;s.style.opacity=0})}}
function openIt(){if(opened)return;opened=true;$('#seal').classList.add('gone');crumble();setTimeout(()=>{$('#env').classList.add('open');petals()},350);setTimeout(()=>$('#stage').classList.add('out'),3000);setTimeout(()=>{$('#stage').remove();document.body.classList.remove('lock');prog()},4000)}
load().then(()=>{
 const t=D.items.find(i=>i.id===id);
 if(!t){$('#stage').remove();document.body.classList.remove('lock');$('#inv').innerHTML='<p>هذه الدعوة غير موجودة.</p>';return}
 document.title='دعوة — '+t.title;$('#bk').href='/templates/'+encodeURIComponent(t.id);
 document.documentElement.style.setProperty('--c1',t.c1);document.documentElement.style.setProperty('--c2',t.c2);
 const s=t.invite||{},v={map:s.map||'',rsvp:s.rsvp||''};for(const k in DEF)v[k]=s[k]||DEF[k];
 d=new Date(v.date);ok=!isNaN(d);$('#sn').textContent=v.names;
 const F=o=>ok?new Intl.DateTimeFormat('ar-IQ',o).format(d):'';
 const steps=v.program.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]);
 $('#inv').innerHTML=`<div class="paper"><p class="sm">بدعوة كريمة</p><p>${esc(v.note)}</p><h2 class="nm">${esc(v.names)}</h2><p class="dt">${F({weekday:'long',day:'numeric',month:'long',year:'numeric'})}<br>الساعة ${F({hour:'numeric',minute:'2-digit'})}</p><div id="cdn"></div><p>📍 ${esc(v.venue)}</p>${v.map?`<a class="bt" href="${esc(v.map)}" target="_blank" rel="noopener">افتح الخرائط</a>`:''}<h3>مخطّط الليلة</h3><div class="tl"><i></i>${steps.map(a=>`<div class="st"><b>${esc(a[0])}</b>${esc(a[1]||'')}</div>`).join('')}</div>${v.rsvp?`<a class="bt" href="${esc(v.rsvp)}" target="_blank" rel="noopener">تأكيد الحضور</a>`:''}</div>`;
 tick();setInterval(tick,1000);addEventListener('scroll',prog,{passive:true});
 $('#env').addEventListener('click',openIt);
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){$('#stage').remove();document.body.classList.remove('lock');prog()}
}).catch(()=>{$('#inv').textContent='تعذّر تحميل البيانات';$('#stage').remove();document.body.classList.remove('lock')});
</script></body></html>
